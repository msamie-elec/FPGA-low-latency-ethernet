name: FPGA pipeline regression
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulator and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog g++ tcl
          python -m pip install pytest
      - name: Reference-model tests
        run: python -m pytest -q tests/
      - name: Generate reproducible vectors
        run: python scripts/generate_vectors.py
      - name: Verify RTL testbenches
        run: bash scripts/run_rtl.sh
      - name: Final M4B/M4C dual-FPGA RTL verification
        run: python scripts/run_final_rtl.py
      - name: Verify clean GitHub Download ZIP builds independently
        run: |
          mkdir -p build/download_check
          git archive --format=tar HEAD | tar -xf - -C build/download_check
          test -f build/download_check/vivado/create_project.tcl
          test -f build/download_check/sim/waves/setup_demo.tcl
          test -f build/download_check/docs/WAVEFORM_DEMO.md
          test -f build/download_check/tests/test_wave_demo.py
          test -f build/download_check/boards/arty_a7/ethernet_m4c_generator.xdc
          test -f build/download_check/boards/arty_a7/ethernet_m4b_endpoint.xdc
          test ! -e build/download_check/rtl/ethernet_generator_a7_m2c.sv
          test ! -e build/download_check/boards/arty_a7/ethernet_m2c_generator.xdc
          test ! -e build/download_check/scripts/build_m3_endpoint.tcl
          test ! -e build/download_check/tests/generated/m2c_a_standard.hex
          (cd build/download_check && python -m pytest -q tests && python scripts/run_final_rtl.py)

